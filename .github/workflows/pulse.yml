# City Pulse: score yesterday for every live station and publish the dashboard.
#
#   1. download new MUSTANG data and score it   (python src/pulse.py)
#   2. commit site/data/ so the history lives in git (and keeps the repo "active":
#      GitHub pauses scheduled workflows on repos with no activity for 60 days)
#   3. ask Vercel to redeploy (deploy hook), in case it ignores bot-made commits
#   4. publish site/ to GitHub Pages (mirror, until it is retired)
#
# Downloaded months are kept in an Actions cache, so old months are never fetched twice.
name: pulse

on:
  schedule:
    - cron: "0 6 * * *"        # every day, 06:00 UTC
  workflow_dispatch:            # "Run workflow" button
  push:
    branches: [main]
    paths: ["site/**", "src/pulse.py", "groundtruth/**", ".github/workflows/pulse.yml"]

permissions:
  contents: write               # commit site/data
  pages: write
  id-token: write

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/cache/mustang
          key: mustang-${{ github.run_id }}
          restore-keys: mustang-
      - run: python src/pulse.py
      - name: Commit today's data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "pulse: data $(date -u +%F)"
          git pull --rebase
          git push
          echo "pushed=1" >> "$GITHUB_OUTPUT"
      - name: Ask Vercel to deploy the new data
        # Vercel's Git integration may skip commits made by github-actions[bot] on the free plan,
        # so call the project's deploy hook (a secret URL that builds main) after every data push.
        if: steps.commit.outputs.pushed == '1'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "no VERCEL_DEPLOY_HOOK secret; skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK" -o /dev/null && echo "Vercel deploy requested" \
            || echo "::warning::Vercel deploy hook failed; the site there may be a day behind"
      - name: Stamp asset URLs with the commit, so browsers never mix old code with new data
        # only our own files (src="name.js"), never the CDN URLs, whose integrity hashes are pinned
        run: sed -i "s/src=\"\([a-z]*\)\.js\"/src=\"\1.js?v=${GITHUB_SHA::7}\"/g; s/href=\"style\.css\"/href=\"style.css?v=${GITHUB_SHA::7}\"/" site/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
