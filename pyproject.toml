[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundtruth"
version = "0.2.0"
description = "Read a city's weekly rhythm from the seismic noise people make"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "See repository" }

[tool.setuptools]
packages = ["groundtruth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
